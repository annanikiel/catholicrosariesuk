name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v6

      # Builds the pages from site/content/*.json. If a JSON file has a mistake, this step fails
      # with a message saying where, and the live site is left as it was.
      - name: Build website from content
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node site/build/build.mjs

      # If the API_BASE_URL repository variable is set (Settings > Secrets and variables > Actions > Variables),
      # write it into config.js so the forms talk to the AWS backend.
      - name: Configure API URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            printf 'window.CRUK_CONFIG = {\n  apiBaseUrl: "%s"\n};\n' "${API_BASE_URL%/}" > _site/config.js
            echo "Using API at ${API_BASE_URL%/}"
          else
            echo "API_BASE_URL not set; using site/static/config.js as committed."
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
